services:
  postgres:
    env_file:
      - .env
    image: postgres:16-alpine
    container_name: sql_qa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${PG_USER}"
      POSTGRES_PASSWORD: "${PG_PASSWORD}"
      POSTGRES_DB: "${PG_DATABASE}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

